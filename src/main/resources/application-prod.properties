# PostgreSQL Production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/randevumdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 Console kapalı (prod)
spring.h2.console.enabled=false

# Logging (Production)
logging.level.root=WARN
logging.level.com.asaf.appointment_service=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

# CORS Production (subdomain setup)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://randevum.tr,https://www.randevum.tr,https://app.randevum.tr}

# Cookie Production (Secure, HttpOnly, SameSite, subdomain-shared)
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.cookie.domain=${APP_COOKIE_DOMAIN:.randevum.tr}

# Frontend Base URL
app.email.base-url=${APP_BASE_URL:https://randevum.tr}

# Actuator Health Check (Coolify health probe)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
