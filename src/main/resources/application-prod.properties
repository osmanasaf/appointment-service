# PostgreSQL Production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/randevumdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — default update for empty DB; set SPRING_JPA_HIBERNATE_DDL_AUTO=validate when Flyway baseline exists
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
# Default off: only V202604081000 exists (ALTER businesses). Set SPRING_FLYWAY_ENABLED=true after adding baseline migrations
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 Console kapalı (prod)
spring.h2.console.enabled=false

# Logging (Production)
logging.level.root=WARN
logging.level.com.asaf.appointment_service=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

# CORS Production (subdomain setup)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://randevum.pro,https://www.randevum.pro,https://app.randevum.pro}

# Cookie Production (Secure, HttpOnly, SameSite, subdomain-shared)
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.cookie.domain=${APP_COOKIE_DOMAIN:.randevum.pro}

# Frontend Base URL
app.email.base-url=${APP_BASE_URL:https://randevum.pro}

# Actuator Health Check (Coolify health probe)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
