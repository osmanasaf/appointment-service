spring.application.name=appointment-service

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:appointmentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# Logging
logging.level.com.asaf.appointment_service=INFO
logging.level.org.springframework.security=WARN

# WhatsApp Webhook (verify token for GET subscription)
app.whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}

# SMS Fallback (when WhatsApp fails)
app.sms.enabled=${APP_SMS_ENABLED:false}
app.sms.from=${APP_SMS_FROM:}

# CORS (comma-separated origins; default dev frontends)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5375}

# Encryption (AES-256 key for sensitive data e.g. national ID). Production'da mutlaka override edin.
app.encryption.secret-key=${APP_ENCRYPTION_SECRET_KEY:ChangeMeInProduction32Bytes!!}
