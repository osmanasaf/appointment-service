spring.application.name=randevum-api

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:appointmentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# Logging
logging.level.com.asaf.appointment_service=INFO
logging.level.org.springframework.security=WARN

# JWT Configuration
jwt.secret=${JWT_SECRET:defaultSecretKeyThatShouldBeChangedInProduction123456}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# WhatsApp Cloud API Configuration
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.provider=${WHATSAPP_PROVIDER:mock}
whatsapp.meta.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.meta.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.meta.waba-id=${WHATSAPP_WABA_ID:}
whatsapp.meta.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.meta.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
whatsapp.meta.api-version=${WHATSAPP_API_VERSION:v20.0}

# SMS Fallback (when WhatsApp fails)
app.sms.enabled=${APP_SMS_ENABLED:false}
app.sms.from=${APP_SMS_FROM:}

# CORS (comma-separated origins; subdomain setup)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5375,https://randevum.tr,https://app.randevum.tr}

# Encryption (AES-256 key for sensitive data e.g. national ID). Production'da mutlaka override edin.
app.encryption.secret-key=${APP_ENCRYPTION_SECRET_KEY:ChangeMeInProduction32Bytes!!}

# Email (Resend)
app.email.from=${APP_EMAIL_FROM:noreply@randevum.tr}
app.email.base-url=${APP_BASE_URL:http://localhost:5173}
app.email.resend.api-key=${RESEND_API_KEY:}

# Rate Limiting
ratelimit.enabled=${RATELIMIT_ENABLED:true}
ratelimit.auth.requests-per-minute=${RATELIMIT_AUTH_RPM:10}
ratelimit.public-api.requests-per-minute=${RATELIMIT_PUBLIC_RPM:30}
ratelimit.webhook.requests-per-minute=${RATELIMIT_WEBHOOK_RPM:100}

# Cookie Configuration
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
